<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu - Klaschuk Restaurant</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/animations.css" />
    <link rel="stylesheet" href="../css/menu.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="close-btn">&times;</span>
      </div>
      <div class="sidebar-content">
        <a href="../index.html">Home</a>
        <a href="menu.html" class="active">Menu</a>
        <a href="gallery.html">Gallery</a>
        <a href="contacts.html">Contacts</a>
      </div>
    </div>

    <header>
      <nav class="top-nav">
        <div class="logo">Klaschuk</div>
        <div class="nav-toggle">
          <a href="#" id="menu-toggle">
            <i class="fas fa-bars"></i>
          </a>
        </div>
      </nav>
    </header>

    <main class="menu-page">
      <div class="menu-categories">
        <!-- Category buttons will be inserted here by JavaScript -->
      </div>

      <div class="menu-items">
        <div class="menu-item">
          <div class="item-image">
            <img src="../images/dishes/avok.jpg" alt="Avocado Sandwich" />
          </div>
          <div class="item-info">
            <h3>Avocado Sandwich</h3>
            <div class="item-details">
              <span class="weight">250g</span>
              <span class="price">8.99€</span>
            </div>
            <a href="#" class="view-details" data-id="avocado-sandwich"
              >View Details</a
            >
          </div>
        </div>
        <!-- Add more menu items here if needed -->
      </div>
    </main>

    <footer>
      <nav class="bottom-nav">
        <a href="../index.html"><i class="fas fa-home"></i></a>
        <a href="menu.html" class="active"><i class="fas fa-utensils"></i></a>
        <a href="gallery.html"><i class="fas fa-images"></i></a>
        <a href="contacts.html"><i class="fas fa-address-book"></i></a>
      </nav>
    </footer>

    <script src="../js/main.js"></script>
    <script src="../js/menu.js"></script>
  </body>
</html>
