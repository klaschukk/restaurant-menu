<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery - Klaschuk Restaurant</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/animations.css" />
    <link rel="stylesheet" href="../css/gallery.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="close-btn" id="close-btn">&times;</span>
      </div>
      <div class="sidebar-content">
        <a href="../index.html">Home</a>
        <a href="../pages/menu.html">Menu</a>
        <a href="../pages/gallery.html">Gallery</a>
        <a href="../pages/contacts.html">Contacts</a>
      </div>
    </div>

    <header>
      <nav class="top-nav">
        <div class="logo">Klaschuk</div>
        <div class="nav-toggle">
          <a href="#" id="menu-toggle">
            <i class="fas fa-bars"></i>
          </a>
        </div>
      </nav>
    </header>

    <main class="gallery-page">
      <div class="gallery-filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="interior">Interior</button>
        <button class="filter-btn" data-filter="dishes">Dishes</button>
        <button class="filter-btn" data-filter="events">Events</button>
      </div>

      <div class="gallery-grid">
        <div class="gallery-item" data-category="interior">
          <img
            src="../images/gallery/interior-1.jpg"
            alt="Restaurant Interior"
          />
          <div class="overlay">
            <span class="category">Interior</span>
            <i class="fas fa-expand-alt"></i>
          </div>
        </div>
        <!-- Add more gallery items following the same structure -->
      </div>
    </main>

    <div class="lightbox" id="lightbox">
      <span class="close-lightbox">&times;</span>
      <img src="" alt="" class="lightbox-image" />
      <button class="prev-btn"><i class="fas fa-chevron-left"></i></button>
      <button class="next-btn"><i class="fas fa-chevron-right"></i></button>
    </div>

    <footer>
      <nav class="bottom-nav">
        <a href="../index.html"><i class="fas fa-home"></i></a>
        <a href="menu.html"><i class="fas fa-utensils"></i></a>
        <a href="gallery.html" class="active"><i class="fas fa-images"></i></a>
        <a href="contacts.html"><i class="fas fa-address-book"></i></a>
      </nav>
    </footer>

    <script src="../js/main.js"></script>
    <script src="../js/gallery.js"></script>
    <script src="../js/sidebar.js"></script>
  </body>
</html>
