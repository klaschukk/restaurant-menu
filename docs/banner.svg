<g class="in" style="animation-delay:.45s"><rect x="76" y="222" width="64" height="32" rx="11" fill="#d4a72c" fill-opacity=".13" stroke="#d4a72c" stroke-opacity=".5"/><text x="108" y="243" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#e6edf3">HTML</text><rect x="150" y="222" width="55" height="32" rx="11" fill="#d4a72c" fill-opacity=".13" stroke="#d4a72c" stroke-opacity=".5"/><text x="178" y="243" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#e6edf3">CSS</text><rect x="215" y="222" width="118" height="32" rx="11" fill="#d4a72c" fill-opacity=".13" stroke="#d4a72c" stroke-opacity=".5"/><text x="274" y="243" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#e6edf3">JavaScript</text></g>
